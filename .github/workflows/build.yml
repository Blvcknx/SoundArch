name: Build VST3 (Windows)

on:
  workflow_dispatch: 

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
        
    - name: Install GDAL (vcpkg)
      run: vcpkg install gdal:x64-windows
        
    - name: Setup MSVC
      uses: microsoft/setup-msbuild@v2
      
    - name: Configure CMake
      run: |
        cd LandscapeAcousticVST
        cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake"
        
    - name: Compile VST3
      run: |
        cd LandscapeAcousticVST
        cmake --build build --config Release --parallel 4
        
    - name: Upload VST3 Artifact
      uses: actions/upload-artifact@v4
      with:
        name: LandscapeAcousticVST-VST3
        path: LandscapeAcousticVST/build/LandscapeAcousticVST_artefacts/Release/VST3/
