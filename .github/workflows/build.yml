name: Build VST3 (Windows)

on:
  workflow_dispatch: 

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
        
    - name: Install GDAL Dependency
      # Dropped the specific version to pull the latest available package
      run: choco install gdal -y
        
    - name: Setup MSVC
      uses: microsoft/setup-msbuild@v2
      
    - name: Configure CMake
      run: |
        cd LandscapeAcousticVST
        mkdir build
        cd build
        # Added explicit GDAL_ROOT path mapping based on the repo's documentation
        cmake .. -DCMAKE_BUILD_TYPE=Release -DGDAL_ROOT="C:\Program Files\GDAL"
        
    - name: Compile VST3
      run: |
        cd LandscapeAcousticVST/build
        cmake --build . --config Release --parallel 4
        
    - name: Upload VST3 Artifact
      uses: actions/upload-artifact@v4
      with:
        name: LandscapeAcousticVST-VST3
        path: LandscapeAcousticVST/build/LandscapeAcousticVST_artefacts/Release/VST3/
